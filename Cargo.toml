[package]
name = "lubdub"
version = "0.1.0"
edition = "2021"
description = "Audio a CARDIAC decodes: the stage encoder, and the lub and dub players that decode on CARDIACs"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/StrangeQuery/lubdub"
readme = "README.md"
keywords = ["cardiac", "audio", "adpcm", "retrocomputing", "education"]
categories = ["multimedia::audio", "emulators", "command-line-utilities"]
# what a package gets: the library and commands, and the decoder the library embeds
include = ["/src", "/lub", "/dub", "/stage", "/audio/decode.cq", "/README.md", "/LICENSE"]

[lib]
name = "lubdub"
path = "src/lib.rs"

# stage codes a channel as a track of cards, lub decodes it on a CARDIAC and outputs the samples, dub decodes
# two, left and right, each on a CARDIAC of its own, and outputs them as one stereo stream
[[bin]]
name = "stage"
path = "stage/main.rs"

[[bin]]
name = "lub"
path = "lub/main.rs"

[[bin]]
name = "dub"
path = "dub/main.rs"

[dependencies]
# the CARDIAC engine: the machine, decks and the assembler
heartburn = "0.1"

[profile.release]
debug = false
